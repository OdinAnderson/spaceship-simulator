<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark space -->
  <rect width="64" height="64" rx="12" fill="#05080f"/>

  <!-- Stars -->
  <circle cx="10" cy="12" r="0.8" fill="#d8e8f5"/>
  <circle cx="54" cy="9"  r="0.6" fill="#7a96b4"/>
  <circle cx="56" cy="40" r="0.9" fill="#d8e8f5"/>
  <circle cx="8"  cy="48" r="0.7" fill="#a78bfa"/>
  <circle cx="48" cy="54" r="0.5" fill="#7a96b4"/>
  <circle cx="20" cy="6"  r="0.5" fill="#7a96b4"/>

  <!-- Orbit ring -->
  <ellipse cx="32" cy="32" rx="24" ry="9"
           fill="none" stroke="#1b2d46" stroke-width="1.5"
           transform="rotate(-30 32 32)"/>

  <!-- Rocket body (pointing up-right) -->
  <g transform="translate(32 32) rotate(45)">
    <!-- Flame -->
    <path d="M -3 14 Q 0 22 3 14 Q 0 18 -3 14 Z" fill="#fbbf24"/>
    <path d="M -2 14 Q 0 19 2 14 Q 0 16 -2 14 Z" fill="#f87171"/>

    <!-- Body -->
    <path d="M -4 -10
             Q 0 -16 4 -10
             L 4 10
             L -4 10 Z"
          fill="#d8e8f5" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Window -->
    <circle cx="0" cy="-4" r="2.2" fill="#38bdf8" stroke="#05080f" stroke-width="0.8"/>

    <!-- Fins -->
    <path d="M -4 6 L -8 12 L -4 11 Z" fill="#38bdf8"/>
    <path d="M  4 6 L  8 12 L  4 11 Z" fill="#38bdf8"/>
  </g>
</svg>
